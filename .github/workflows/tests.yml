name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      # The text extra lets the Vision test run against the real client types.
      # It makes no network calls and needs no credentials.
      - name: Install
        run: python -m pip install ".[dev,text]"
      - name: Run pytest
        run: python -m pytest -v
